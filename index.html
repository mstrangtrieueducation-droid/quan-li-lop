<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b5394">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; frame-src">
<title>Quản lí lớp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e8eef6; --card: #ffffff; --head: #0b3d6e; --head-ink: #ffffff; --head-muted: #b9cde3; --head-on: #ffffff; --head-on-ink: #0b3d6e; --ink: #18212f; --muted: #5d6b7e; --line: #e2e7ee; --soft: #eef2f7;
    --brand: #0b5394; --brand-soft: #e6f0f9; --on-brand: #ffffff;
    --ok: #12703a; --ok-soft: #e4f4ea; --warn: #9a5b00; --warn-soft: #fdf1dc; --bad: #b3261e; --bad-soft: #fbe9e7;
    --shadow: 0 1px 2px rgba(24, 33, 47, .08), 0 6px 18px rgba(24, 33, 47, .07);
    --morning: #8a5a00; --morning-soft: #fff1d2; --afternoon: #1f6fb8; --afternoon-soft: #dfedfb; --evening: #4b2fa0; --evening-soft: #ebe5fb;
    /* One colour per kind of class; the kind is always written too, so colour is never the only cue. */
    --k-kids: #1f6fb8; --k-ielts: #6b4bc4; --k-fighter: #b3640a; --k-tutor: #5d6b7e; --k-ta: #1a7f48;
    color-scheme: light;
  }
  :root[data-theme="dark"] { color-scheme: dark; }
  /* Light unless the viewer picks dark (button in the bar), or the device is dark and nothing was picked. */
  @media (prefers-color-scheme: dark) {
    :root[data-theme="auto"] {
      --bg: #0f141b; --card: #1a212b; --head: #141c27; --head-ink: #e8edf3; --head-muted: #9aa8b8; --head-on: #2a3a50; --head-on-ink: #e8edf3;
      --morning: #ecb45c; --morning-soft: #3a2c13; --afternoon: #6aa9e4; --afternoon-soft: #1d3247; --evening: #b59cf0; --evening-soft: #2c2445; --ink: #e8edf3; --muted: #9aa8b8; --line: #2c3643; --soft: #232c38;
      --brand: #6aa9e4; --brand-soft: #1d3247; --on-brand: #0d1a26;
      --ok: #6fd093; --ok-soft: #173325; --warn: #ecb45c; --warn-soft: #3a2c13; --bad: #f2938b; --bad-soft: #3d1f1c;
      --shadow: none;
      --k-kids: #6aa9e4; --k-ielts: #b59cf0; --k-fighter: #ecb45c; --k-tutor: #8fa0b3; --k-ta: #6fd093;
    }
  }
  :root[data-theme="dark"] {
      --bg: #0f141b; --card: #1a212b; --head: #141c27; --head-ink: #e8edf3; --head-muted: #9aa8b8; --head-on: #2a3a50; --head-on-ink: #e8edf3;
      --morning: #ecb45c; --morning-soft: #3a2c13; --afternoon: #6aa9e4; --afternoon-soft: #1d3247; --evening: #b59cf0; --evening-soft: #2c2445; --ink: #e8edf3; --muted: #9aa8b8; --line: #2c3643; --soft: #232c38;
      --brand: #6aa9e4; --brand-soft: #1d3247; --on-brand: #0d1a26;
      --ok: #6fd093; --ok-soft: #173325; --warn: #ecb45c; --warn-soft: #3a2c13; --bad: #f2938b; --bad-soft: #3d1f1c;
      --shadow: none;
      --k-kids: #6aa9e4; --k-ielts: #b59cf0; --k-fighter: #ecb45c; --k-tutor: #8fa0b3; --k-ta: #6fd093;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Be Vietnam Pro", Arial, sans-serif; font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }
  h1, h2, h3, p { margin: 0; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { min-height: 44px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-weight: 500; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .55; cursor: default; }
  select, input, textarea { min-height: 44px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); max-width: 100%; }
  textarea { width: 100%; min-height: 72px; resize: vertical; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  a { color: var(--brand); }
  .primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-weight: 600; }
  .primary:hover { border-color: var(--brand); filter: brightness(1.08); }
  .quiet { border-color: transparent; background: none; color: var(--brand); padding: 6px 8px; min-height: 36px; }
  .quiet:hover { border-color: transparent; background: var(--brand-soft); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  /* Sign-in */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login-box { width: 100%; max-width: 380px; padding: 32px 24px; text-align: center; }
  .logo { width: 52px; height: 52px; margin: 0 auto 16px; border-radius: 14px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-weight: 700; font-size: 22px; }
  .login-box h1 { font-size: 22px; font-weight: 700; }
  .login-box p { color: var(--muted); margin: 8px 0 20px; }
  #btnLogin { width: 100%; min-height: 48px; }
  #loginMsg { margin: 12px 0 0; min-height: 22px; font-size: 14px; color: var(--bad); }

  /* Shell */
  header { position: sticky; top: 0; z-index: 5; background: var(--head); color: var(--head-ink); box-shadow: 0 2px 8px rgba(0, 0, 0, .12); }
  header .quiet { color: var(--head-ink); }
  header .quiet:hover { background: rgba(255, 255, 255, .12); }
  header #saveState { color: var(--head-muted); }
  .bar { max-width: 1200px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 17px; color: var(--head-ink); margin-right: 8px; letter-spacing: .01em; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button { min-height: 40px; padding: 6px 14px; border-color: transparent; background: none; color: var(--head-muted); }
  nav button:hover { color: var(--head-ink); border-color: transparent; background: rgba(255, 255, 255, .1); }
  nav button.on { background: var(--head-on); color: var(--head-on-ink); font-weight: 700; }
  .spacer { flex: 1; }
  #saveState { font-size: 13px; color: var(--muted); white-space: nowrap; }
  #saveState.err { color: var(--bad); font-weight: 600; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px 16px 72px; display: grid; gap: 12px; }
  .notice { padding: 10px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-weight: 500; }
  .notice.bad { background: var(--bad-soft); color: var(--bad); }
  .notice.ok { background: var(--ok-soft); color: var(--ok); }

  /* Shared pieces */
  .daybar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .daybar b { flex: 1; min-width: 130px; font-size: 20px; font-weight: 700; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button { flex: none; min-height: 40px; white-space: nowrap; }
  .tabs button.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-weight: 600; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filters select, .filters input { flex: 1 1 150px; min-width: 0; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--soft); color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.bad { background: var(--bad-soft); color: var(--bad); }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }
  h2 { font-size: 16px; font-weight: 700; }
  .list { display: grid; gap: 8px; }

  /* Day summary */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
  .stat { padding: 12px 16px; display: grid; gap: 2px; border: 0; border-top: 4px solid var(--brand); }
  .stat b { color: var(--brand); }
  .stat b { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .stat span { font-size: 13px; color: var(--muted); font-weight: 500; }
  .stat.k-kids { border-top-color: var(--k-kids); background: color-mix(in srgb, var(--k-kids) 10%, var(--card)); } .stat.k-kids b { color: var(--k-kids); }
  .stat.k-ielts { border-top-color: var(--k-ielts); background: color-mix(in srgb, var(--k-ielts) 10%, var(--card)); } .stat.k-ielts b { color: var(--k-ielts); }
  .stat.k-fighter { border-top-color: var(--k-fighter); background: color-mix(in srgb, var(--k-fighter) 10%, var(--card)); } .stat.k-fighter b { color: var(--k-fighter); }
  .stat.k-tutor { border-top-color: var(--k-tutor); background: color-mix(in srgb, var(--k-tutor) 10%, var(--card)); } .stat.k-tutor b { color: var(--k-tutor); }
  .stat.k-ta { border-top-color: var(--k-ta); background: color-mix(in srgb, var(--k-ta) 10%, var(--card)); } .stat.k-ta b { color: var(--k-ta); }
  .stat.off { border-top-color: var(--bad); background: var(--bad-soft); } .stat.off b { color: var(--bad); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { min-height: 36px; padding: 4px 12px; border-radius: 99px; font-size: 14px; }
  .chips button.on { background: var(--ink); border-color: var(--ink); color: var(--card); font-weight: 600; }
  .part { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .part::after { content: ""; flex: 1; height: 2px; border-radius: 2px; background: var(--line); }
  .part h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; padding: 4px 12px; border-radius: 99px; background: var(--soft); color: var(--muted); }
  .part.p-0 h2 { background: var(--morning-soft); color: var(--morning); } .part.p-1 h2 { background: var(--afternoon-soft); color: var(--afternoon); } .part.p-2 h2 { background: var(--evening-soft); color: var(--evening); }
  .part span { font-size: 13px; color: var(--muted); font-weight: 600; }
  .grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); align-items: start; }

  /* Sessions: time on the left, a coloured edge for the kind of class */
  .session { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; width: 100%; padding: 12px 14px 12px 12px; text-align: left; font-weight: 400; border-left: 4px solid var(--line); }
  .session.k-kids { border-left-color: var(--k-kids); background: color-mix(in srgb, var(--k-kids) 9%, var(--card)); } .session.k-kids .s-time b { color: var(--k-kids); }
  .session.k-ielts { border-left-color: var(--k-ielts); background: color-mix(in srgb, var(--k-ielts) 9%, var(--card)); } .session.k-ielts .s-time b { color: var(--k-ielts); }
  .session.k-fighter { border-left-color: var(--k-fighter); background: color-mix(in srgb, var(--k-fighter) 9%, var(--card)); } .session.k-fighter .s-time b { color: var(--k-fighter); }
  .session.k-tutor { border-left-color: var(--k-tutor); background: color-mix(in srgb, var(--k-tutor) 9%, var(--card)); } .session.k-tutor .s-time b { color: var(--k-tutor); }
  .session.k-ta { border-left-color: var(--k-ta); background: color-mix(in srgb, var(--k-ta) 9%, var(--card)); } .session.k-ta .s-time b { color: var(--k-ta); }
  .s-time { display: grid; align-content: start; gap: 0; font-variant-numeric: tabular-nums; }
  .s-time b { font-size: 17px; font-weight: 700; line-height: 1.3; }
  .s-time span { font-size: 13px; color: var(--muted); }
  .s-body { display: grid; gap: 4px; min-width: 0; }
  .s-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .s-head strong { font-size: 16px; font-weight: 700; }
  .kind { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 1px 7px; border-radius: 6px; color: #fff; }
  .kind.k-kids { background: var(--k-kids); } .kind.k-ielts { background: var(--k-ielts); } .kind.k-fighter { background: var(--k-fighter); } .kind.k-tutor { background: var(--k-tutor); } .kind.k-ta { background: var(--k-ta); }
  :root[data-theme="dark"] .kind { color: #0d1a26; }
  @media (prefers-color-scheme: dark) { :root[data-theme="auto"] .kind { color: #0d1a26; } }
  .s-book { font-weight: 500; }
  .people { display: flex; gap: 4px 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .people b { color: var(--ink); font-weight: 600; }
  @media (max-width: 460px) { .session { grid-template-columns: 52px minmax(0, 1fr); gap: 10px; } }
  .session.link { cursor: pointer; }
  .session.link:hover { border-color: var(--brand); }
  .session.off { opacity: .6; }
  .session-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .session-top time { font-weight: 700; font-size: 16px; }
  .session-top strong { font-size: 16px; font-weight: 700; }
  .room { font-weight: 600; color: var(--brand); background: var(--brand-soft); padding: 1px 8px; border-radius: 6px; font-size: 12px; }
  .detail { white-space: pre-line; color: var(--muted); font-size: 14px; }

  /* Lên lớp: fills whatever window it is given, down to a third of a board, with targets a finger can hit */
  body.lenlop header { display: none; }
  body.lenlop main { max-width: none; padding: 8px; gap: 8px; min-height: 100vh; grid-template-rows: auto auto 1fr; align-content: start; }
  .ll-open { justify-self: start; min-height: 52px; font-size: 17px; font-weight: 700; }
  .ll-head { display: flex; align-items: center; gap: 8px; }
  .ll-head > button { min-height: 52px; min-width: 52px; font-size: 16px; }
  .ll-title { flex: 1; min-width: 0; display: grid; }
  .ll-title b { font-size: 20px; line-height: 1.2; }
  .ll-title span { color: var(--muted, #667); font-size: 14px; }
  .ll-list { display: grid; gap: 4px; grid-auto-rows: minmax(52px, 1fr); }
  .ll-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 48px 64px; gap: 4px; align-items: stretch; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; touch-action: manipulation; }
  .ll-row.top { background: var(--warn-soft); border-color: var(--warn); }
  .ll-row.off { grid-template-columns: minmax(0, 1fr) auto 64px; background: var(--bad-soft); border-color: var(--bad); }
  .ll-row button { min-height: 44px; padding: 0 6px; border-radius: 9px; }
  .ll-main { display: flex; align-items: center; gap: 8px; text-align: left; border: 0; background: transparent; min-width: 0; font-weight: 700; }
  .ll-main:active:not(:disabled) { background: var(--brand-soft); }
  .ll-rank { width: 30px; flex: none; text-align: center; font-size: 20px; }
  .ll-name { font-size: clamp(17px, 2.6vw, 24px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ll-row.off .ll-name { color: var(--bad); text-decoration: line-through; }
  .ll-count { min-width: 66px; font-size: 19px; font-weight: 700; }
  .ll-minus { font-size: 22px; font-weight: 700; }
  .ll-absent { font-size: 14px; font-weight: 600; }
  .ll-off { align-self: center; color: var(--bad); font-weight: 700; padding: 0 6px; }
  /* Class */
  .class-head { padding: 14px; display: grid; gap: 4px; }
  .class-head h1 { font-size: 20px; font-weight: 700; }
  .count { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-weight: 600; }
  .pupil { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; padding: 10px 12px; }
  .pupil + .pupil { border-top: 1px solid var(--line); }
  .pupil.absent { background: var(--bad-soft); }
  .tick { width: 48px; height: 48px; padding: 0; border-radius: 12px; font-size: 22px; font-weight: 700; color: transparent; }
  .tick.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .tick.late { background: var(--warn); border-color: var(--warn); color: #fff; }
  .who b { display: block; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .owed { grid-column: 2 / -1; color: var(--bad); font-size: 13px; font-weight: 500; }
  .grades { display: flex; gap: 4px; }
  .grades button { width: 44px; padding: 0; font-weight: 600; }
  .grades button.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .grades button.on.F { background: var(--bad); border-color: var(--bad); color: #fff; }
  .grades button.on.B { background: var(--warn); border-color: var(--warn); color: #fff; }
  @media (max-width: 460px) {
    .pupil { grid-template-columns: 48px minmax(0, 1fr); }
    .grades { grid-column: 2; }
    .grades button { flex: 1; }
    .owed { grid-column: 2; }
  }

  /* Rows for managers */
  .row { padding: 12px 14px; display: grid; gap: 8px; }
  .row-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .row-top b { font-weight: 700; }
  .choices { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .choices button { min-width: 88px; }
  .choices button.on { color: #fff; font-weight: 600; }
  .choices button.on.good { background: var(--ok); border-color: var(--ok); }
  .choices button.on.mid { background: var(--warn); border-color: var(--warn); }
  .choices button.on.low { background: var(--bad); border-color: var(--bad); }
  .choices input[type=number] { width: 84px; }
  .choices input[type=text] { flex: 1 1 160px; min-width: 0; }
  .form { padding: 14px; display: grid; gap: 10px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
  label > * { font-size: 15px; font-weight: 400; color: var(--ink); width: 100%; }
  .table { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  details summary { cursor: pointer; font-weight: 600; min-height: 28px; }
  .check { display: flex; gap: 10px; align-items: flex-start; }
  .check button { flex: none; width: 44px; padding: 0; font-weight: 700; color: transparent; }
  .check button.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .ret { padding: 10px 12px; } .ret.mine { border-color: var(--k-ta); box-shadow: 0 0 0 2px color-mix(in srgb, var(--k-ta) 35%, transparent); }
  .check button { min-height: 44px; height: 44px; font-size: 20px; border-width: 2px; }
</style>
</head>
<body>
<div id="login" hidden>
  <div class="card login-box">
    <div class="logo">L</div>
    <h1>Quản lí lớp</h1>
    <p id="loginText">Vui lòng mở app bằng link riêng quản lí đã gửi cho bạn.</p>
    <p id="loginMsg"></p>
    <button id="btnLangLogin" class="quiet">English</button>
  </div>
</div>
<div id="app" hidden>
  <header>
    <div class="bar">
      <span class="brand">Quản lí lớp</span>
      <nav id="nav"></nav>
      <span class="spacer"></span>
      <span id="saveState" role="status"></span>
      <button id="btnTheme" class="quiet" aria-label="Đổi nền sáng / tối">Nền tối</button>
      <button id="btnLang" class="quiet">English</button>
      <button id="btnOut" class="quiet">Thoát</button>
    </div>
  </header>
  <main id="main"></main>
</div>
<script src="config.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
